<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A silly study game for word parts (prefixes, suffixes, roots). Creatures pop up when you get it right.">
<meta name="theme-color" content="#F2F7EA">
<title>Word Parts Wildlife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column woodland game. Home = mode picker; play = one big question card with tap-size answers; creatures pop from the bottom edge. */
:root{
  --bg:#F2F7EA;         /* meadow */
  --card:#FFFFFF;
  --ink:#213524;        /* forest ink */
  --muted:#5E7262;
  --line:#D8E4CF;
  --accent:#E3762A;     /* acorn */
  --accent-ink:#FFFFFF;
  --leaf:#4F9E5B;       /* correct */
  --leaf-soft:#DFF2E0;
  --berry:#C9474F;      /* wrong */
  --berry-soft:#FBE3E4;
  --sun:#F6C244;
  --display:"Fredoka","Nunito","Arial Rounded MT Bold",Arial,sans-serif;
  --body:"Nunito",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17231A; --card:#22312A; --ink:#F0F5EA; --muted:#A9BDAE; --line:#35483B;
  --accent:#F08A3E; --accent-ink:#1A1208; --leaf:#6FC97C; --leaf-soft:#27432E;
  --berry:#F07078; --berry-soft:#4A2A2E; --sun:#F9D061; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17231A; --card:#22312A; --ink:#F0F5EA; --muted:#A9BDAE; --line:#35483B;
  --accent:#F08A3E; --accent-ink:#1A1208; --leaf:#6FC97C; --leaf-soft:#27432E;
  --berry:#F07078; --berry-soft:#4A2A2E; --sun:#F9D061; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 span{color:var(--accent)}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s}
.mode:hover,.mode:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.mode .ico{font-size:2rem;line-height:1}
.mode .name{font-family:var(--display);font-weight:600;font-size:1.15rem}
.mode .desc{color:var(--muted);font-size:.9rem;line-height:1.3}
.intro{color:var(--muted);margin:0;font-weight:500}
.mode.challenge{grid-column:1 / -1;border-color:var(--accent);background:linear-gradient(135deg,var(--card),var(--leaf-soft))}
.mode.challenge[disabled]{opacity:.55;cursor:default;border-color:var(--line);background:var(--card);transform:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--berry-soft);border:2px solid var(--berry);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:700}
.link{background:none;border:0;color:var(--muted);font-family:var(--body);font-weight:800;text-decoration:underline;cursor:pointer;align-self:flex-start;padding:0;font-size:.85rem}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sets label{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.9rem;cursor:pointer}
.sets input{accent-color:var(--accent);width:16px;height:16px}

.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:800;color:var(--muted)}
.prompt{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;text-wrap:balance;margin:0}
.prompt.big{font-size:2.6rem;color:var(--accent)}
.hint{color:var(--muted);margin:0}
.opts{display:grid;gap:10px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-family:var(--body);font-weight:700;font-size:1.05rem;color:var(--ink);text-align:left;cursor:pointer;min-height:54px;transition:transform .1s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);outline:none}
.opt:active{transform:scale(.98)}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.wrong{background:var(--berry-soft);border-color:var(--berry);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.feedback{min-height:1.5em;font-weight:800}
.feedback.good{color:var(--leaf)} .feedback.bad{color:var(--berry)}
.explain{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:.95rem;color:var(--muted)}
.explain b{color:var(--ink)}

.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s;border-radius:999px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--accent);color:var(--accent-ink);flex:1;min-width:120px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.berry{background:var(--berry);color:#fff}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* match up */
.match{display:grid;grid-template-columns:minmax(120px,2fr) 3fr;gap:12px;align-items:start}
.tray{display:flex;flex-direction:column;gap:10px;min-height:60px;padding:8px;border-radius:16px;background:var(--bg);border:2px dashed var(--line);min-width:0}
.zones{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone{border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card);transition:border-color .15s,background .15s;min-width:0}
.zone .def{font-weight:700;font-size:.95rem;line-height:1.3}
.zone .slot{min-height:48px;border-radius:12px;background:var(--bg);display:flex;align-items:stretch}
.zone .slot .piece{flex:1}
.zone.over{border-color:var(--accent);background:var(--leaf-soft)}
.zone.good{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.zone.bad{border-color:var(--berry);background:var(--berry-soft)}
.piece{background:var(--sun);color:#2A1F05;border:3px solid #2A1F05;border-radius:12px;padding:10px 12px;font-family:var(--display);font-weight:600;font-size:1.05rem;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:3px 3px 0 #2A1F05;transition:box-shadow .12s;min-width:0;overflow-wrap:anywhere}
.piece.sel{box-shadow:0 0 0 4px var(--accent),3px 3px 0 #2A1F05}
.piece.drag{position:relative;z-index:20;cursor:grabbing;box-shadow:6px 8px 0 rgba(42,31,5,.6);transition:none}
.piece.locked{background:var(--leaf);color:#fff;border-color:var(--leaf);box-shadow:none;cursor:default}
.piece.wrongchip{animation:shake .4s}
.piece:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* flashcard */
.flip{perspective:1000px;cursor:pointer}
.flip .inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:220px}
.flip.is-flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.face.back{transform:rotateY(180deg)}
.face .prompt{text-align:center}
.face ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.95rem}

/* creature stage: full-screen overlay; critters slam down like a rubber stamp */
#stage{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.critter{position:absolute;transform:translate(-50%,-50%);--tilt:-8deg}
/* three nested layers so each motion gets its own easing: drop (scale+fade in, then fade out), settle (squash on landing), content (static tilt) */
.critter .drop{will-change:transform,opacity;animation:stampIn .32s cubic-bezier(.17,.84,.33,1) both, stampOut .45s ease-in 1.55s forwards}
.critter .settle{display:flex;flex-direction:column;align-items:center;gap:8px;transform-origin:50% 100%;animation:stampSettle .36s cubic-bezier(.34,1.56,.64,1) .3s both}
.critter .emo{font-size:4.4rem;line-height:1}
.critter .say{background:var(--sun);color:#2A1F05;border:3px solid #2A1F05;border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:.95rem;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;transform:rotate(var(--tilt));box-shadow:3px 3px 0 #2A1F05}
.critter .shadow{width:76px;height:16px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(4px);margin-top:-6px;animation:shadowIn .3s ease-out .26s both}
@keyframes stampIn{from{transform:scale(2.4) translateZ(0);opacity:0}to{transform:scale(1) translateZ(0);opacity:1}}
@keyframes stampSettle{from{transform:scale(1.08,.9)}to{transform:scale(1,1)}}
@keyframes shadowIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes stampOut{from{opacity:1;transform:translateY(0) translateZ(0)}to{opacity:0;transform:translateY(-14px) translateZ(0)}}
.burst{position:absolute;bottom:0;font-size:2.4rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.sad{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:3rem;animation:sad 1.2s ease-out forwards}
@keyframes sad{0%{transform:translate(-50%,100%)}25%{transform:translate(-50%,0)}75%{transform:translate(-50%,0)}100%{transform:translate(-50%,110%)}}

.end .prompt{text-align:center}
.parade{font-size:2.2rem;text-align:center;letter-spacing:.1em;line-height:1.5}
.stat{display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.missed{font-size:.95rem;color:var(--muted)} .missed b{color:var(--ink)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:auto}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (max-width:380px){.modes{grid-template-columns:1fr}}
</style>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%} [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word Parts <span>Wildlife</span></h1>
    <div class="chips"><div class="chip">Streak <b id="streak">0</b></div><div class="chip">Best <b id="best">0</b></div></div>
  </header>

  <section id="home">
    <p class="intro">Pick a game. Get it right and something furry shows up.</p>
    <div class="sets" id="sets">
      <label><input type="checkbox" id="set-prefix" checked> Prefixes</label>
      <label><input type="checkbox" id="set-suffix" checked> Suffixes</label>
      <label><input type="checkbox" id="set-root" checked> Roots</label>
    </div>
    <div class="modes" id="modes"></div>
    <div class="card" id="trouble" hidden style="margin-top:14px;gap:10px"></div>
  </section>

  <section id="play" hidden></section>

  <footer>21 word parts from the class flashcards. Score and best streak stay on this device only.</footer>
</div>
<div id="stage" aria-hidden="true"></div>

<script>
const PARTS = [
  // prefixes
  {id:'super',type:'Prefix',label:'super-',forms:['super'],meaning:'above, beyond, or very',examples:[['superhuman','beyond what is human'],['superior','higher or better'],['superscript','writing placed above a line']]},
  {id:'supra',type:'Prefix',label:'supra-',forms:['supra'],meaning:'above or beyond',examples:[['supranational','beyond or involving more than one nation'],['suprascript','writing placed above a line'],['suprarenal','above the kidney']]},
  {id:'sub',type:'Prefix',label:'sub-',forms:['sub'],meaning:'under or below',examples:[['submarine','a vessel that travels under water'],['submerge','to put under water'],['subtitle','appears below the main title']]},
  {id:'inter',type:'Prefix',label:'inter-',forms:['inter'],meaning:'between or among',examples:[['interact','to act or communicate with one another'],['interstate','between states'],['international','involving nations']]},
  {id:'pseudo',type:'Prefix',label:'pseudo-',forms:['pseudo'],meaning:'false or not genuine',examples:[['pseudonym','a chosen name used instead of a real name'],['pseudoscience','imitates science but is not based on reliable methods'],['pseudocode','an informal plan for computer instructions']]},
  // suffixes
  {id:'able',type:'Suffix',label:'-able',forms:['able'],meaning:'able to be; can be',pos:'usually makes an adjective',examples:[['readable','able to be read'],['washable','able to be washed'],['breakable','able to be broken']]},
  {id:'ful',type:'Suffix',label:'-ful',forms:['ful'],meaning:'full of; having',pos:'usually makes an adjective',examples:[['helpful','giving help'],['joyful','full of joy'],['careful','showing care']]},
  {id:'ion',type:'Suffix',label:'-ion',forms:['ion'],meaning:'an act, process, or result',pos:'makes a noun',examples:[['action','something done'],['creation','the act of making'],['discussion','the act of talking something over']]},
  {id:'sion',type:'Suffix',label:'-sion',forms:['sion'],meaning:'an act, process, or result',pos:'makes a noun',examples:[['decision','the result of deciding'],['division','the act of dividing'],['extension','the act or result of extending']]},
  {id:'tion',type:'Suffix',label:'-tion',forms:['tion'],meaning:'an act, process, or result',pos:'makes a noun',examples:[['invention','the act or result of creating something new'],['education','the process of learning'],['celebration','the act of celebrating']]},
  {id:'ly',type:'Suffix',label:'-ly',forms:['ly'],meaning:'in a certain manner',pos:'usually makes an adverb',examples:[['quickly','in a quick manner'],['calmly','in a calm manner'],['safely','in a safe manner']]},
  // roots
  {id:'digi',type:'Root',label:'digi / digitus',forms:['digi'],meaning:'finger; by extension, a digit',examples:[['digit','a finger or a number'],['digital','related to digits or electronic information'],['digitize','to change something into digital form']]},
  {id:'hon',type:'Root',label:'hon / honos',forms:['hon'],meaning:'honor',examples:[['honorable','worthy of honor or respect'],['honor','respect or recognition'],['honorary','an honor given as recognition']]},
  {id:'fid',type:'Root',label:'fidel / fid',forms:['fidel','fid'],meaning:'faith or trust',examples:[['fidelity','faithfulness, loyalty, or trustworthiness'],['faithful','loyal or trustworthy'],['confident','feeling sure or trusting in something']]},
  {id:'fic',type:'Root',label:'fic',forms:['fic'],meaning:'make or do',examples:[['fiction','writing made from imagination'],['artificial','made by people'],['proficient','skilled or able to do something well']]},
  {id:'cred',type:'Root',label:'cred / credit',forms:['cred'],meaning:'believe or trust',examples:[['credible','believable or able to be trusted'],['credit','recognition given for someone’s work'],['incredible','hard to believe']]},
  {id:'jur',type:'Root',label:'jur / jus / jud',forms:['jur','jus','jud'],meaning:'law, right, or judging',examples:[['justice','fairness under the law'],['jury','listens to evidence and helps decide a case'],['judicial','related to judges or courts']]},
  {id:'leg',type:'Root',label:'leg',forms:['leg'],meaning:'law',examples:[['legal','allowed by law or connected with law'],['legislate','to make laws'],['legislature','a group that makes laws']]},
  {id:'lig',type:'Root',label:'lig',forms:['lig'],meaning:'bind or choose',examples:[['ligament','a strong band of tissue that binds bones together'],['oblige','to require or bind someone to do something'],['eligible','able to be chosen']]},
  {id:'cit',type:'Root',label:'cit',forms:['cit'],meaning:'call, summon, or cite',examples:[['citation','names or cites a source'],['recite','to say something aloud'],['incite','to call on or urge someone to act']]},
  {id:'ver',type:'Root',label:'ver',forms:['ver'],meaning:'truth',examples:[['verify','to check whether something is true'],['verdict','a decision about a case'],['veracity','truthfulness']]},
];

// each creature only says its own lines
const GOOD = [
  ['🐿️','A squirrel approves.'],['🐿️','Squirrel is saving that answer for winter.'],
  ['🦔','The hedgehog is impressed.'],['🦔','Hedgehog uncurled just to see that.'],
  ['🦉','Owl says: wise choice.'],['🦉','Owl nodded. Slowly. That is a big deal.'],
  ['🦝','Raccoon stole your worries, not your points.'],['🦝','Raccoon rates this answer: shiny.'],
  ['🐸','Frog gives a ribbit of respect.'],['🐸','Frog hopped once. Approved.'],
  ['🦦','The otter is clapping. Otters clap.'],['🦦','Otter is holding hands with your answer.'],
  ['🐢','Turtle got here late but agrees.'],['🐢','Turtle says: slow clap. Literally.'],
  ['🐐','Goat says: GOAT.'],['🐐','Goat climbed something to see that better.'],
  ['🦥','Sloth will celebrate by Thursday.'],['🦥','Sloth blinked. Highest honor available.'],
  ['🐨','Koala woke up for this one.'],['🐨','Koala approves, then went back to sleep.'],
  ['🦫','Beaver built you a tiny trophy.'],['🦫','Beaver says: dam good.'],
  ['🐇','Bunny did a hop. That means yes.'],['🐇','Bunny ears went straight up. Big yes.'],
  ['🦆','Duck quacked in a formal tone.'],['🦆','Duck: quack. Translation: correct.'],
  ['🐧','Penguin slid over to say nice.'],['🐧','Penguin flapped. That is applause.'],
  ['🦜','Parrot repeats: correct, correct.'],['🦜','Parrot learned a new word: YES.'],
  ['🐝','Bee is buzzing about it.'],['🐝','Bee says: un-bee-lievable.'],
  ['🦊','Fox thinks that was clever.'],['🦊','Fox tipped its hat. Fox has a hat now.'],
  ['🐌','Snail arrived to cheer. It took a while.'],['🐌','Snail left a trail of approval.']
];
const CRITTERS = [...new Set(GOOD.map(g=>g[0]))];
const BAD = [
  ['🐿️','The squirrel dropped its acorn. Try the next one.'],['🦔','Nope. The hedgehog curled up.'],['🦉','The owl blinked twice. That means no.'],
  ['🦝','Raccoon looked away politely.'],['🐸','Frog said: ribbit? Not quite.'],['🐢','The turtle is still thinking about it, too.']
];

const MODES = [
  {id:'flash',ico:'🃏',name:'Flashcards',desc:'Flip the card, then say if you knew it.'},
  {id:'meaning',ico:'🐿️',name:'Meaning Match',desc:'See a word part, pick what it means.'},
  {id:'reverse',ico:'🦉',name:'Backwards Bear',desc:'See a meaning, pick the word part.'},
  {id:'detective',ico:'🦝',name:'Word Detective',desc:'See a real word, find the part hiding inside.'},
  {id:'sorter',ico:'🐢',name:'Speedy Sorter',desc:'Prefix, suffix, or root? Go fast.'},
  {id:'match',ico:'🦫',name:'Match Up',desc:'Drag 3 word parts onto their 3 meanings, like the paper sheet.'},
];

let streak=0, best=0, pool=[], run=null, misses={};
try{ best = +localStorage.getItem('wpw-best')||0 }catch(e){}
try{ misses = JSON.parse(localStorage.getItem('wpw-misses')||'{}')||{} }catch(e){ misses={} }
function saveMisses(){ try{ localStorage.setItem('wpw-misses',JSON.stringify(misses)) }catch(e){} }
function recordMiss(p){ misses[p.id]=(misses[p.id]||0)+1; saveMisses(); }
function recordHit(p){ if(misses[p.id]){ misses[p.id]--; if(misses[p.id]<=0) delete misses[p.id]; saveMisses(); } }
function troubleParts(){ return PARTS.filter(p=>misses[p.id]>0); }
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function updateChips(){ $('#streak').textContent=streak; $('#best').textContent=best; }
function bumpStreak(){ streak++; if(streak>best){best=streak; try{localStorage.setItem('wpw-best',best)}catch(e){}} updateChips(); }

// creatures
function popGood(){
  const st=$('#stage'); const c=document.createElement('div'); c.className='critter';
  c.style.left=(25+Math.random()*50)+'%'; c.style.top=(30+Math.random()*30)+'%';
  c.style.setProperty('--tilt',((Math.random()*16-8).toFixed(1))+'deg');
  const g=pick(GOOD);
  c.innerHTML=`<div class="drop"><div class="settle"><div class="say">${g[1]}</div><div class="emo">${g[0]}</div><div class="shadow"></div></div></div>`;
  st.appendChild(c); setTimeout(()=>c.remove(),2100);
  if(streak>0 && streak%5===0) burst();
}
function burst(){
  const st=$('#stage');
  for(let i=0;i<14;i++){ const b=document.createElement('div'); b.className='burst'; b.textContent=pick(CRITTERS);
    b.style.left=(5+Math.random()*90)+'%'; b.style.setProperty('--dx',(Math.random()*200-100)+'px'); b.style.setProperty('--dy',(-200-Math.random()*300)+'px'); b.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    st.appendChild(b); setTimeout(()=>b.remove(),1700); }
}
function popBad(emo){ const st=$('#stage'); const s=document.createElement('div'); s.className='sad'; s.textContent=emo; st.appendChild(s); setTimeout(()=>s.remove(),1300); }

// home
function renderHome(){
  const tp=troubleParts(); const total=tp.reduce((s,p)=>s+misses[p.id],0);
  const chal = tp.length
    ? `<button class="mode challenge" data-mode="challenge"><span class="ico">🦊</span><span class="name">Challenge Round</span><span class="desc">${tp.length} trouble spot${tp.length>1?'s':''} (${total} miss${total>1?'es':''}). Mixed games, only the ones she got wrong.</span></button>`
    : `<button class="mode challenge" disabled><span class="ico">🦊</span><span class="name">Challenge Round</span><span class="desc">Unlocks once a round has some misses in it.</span></button>`;
  $('#modes').innerHTML = MODES.map(m=>`<button class="mode" data-mode="${m.id}"><span class="ico">${m.ico}</span><span class="name">${m.name}</span><span class="desc">${m.desc}</span></button>`).join('') + chal;
  $('#modes').querySelectorAll('.mode[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));
  const tl=$('#trouble');
  if(tp.length){ tl.hidden=false; tl.innerHTML=`<span class="eyebrow">Trouble spots</span><div class="tags">${tp.sort((a,b)=>misses[b.id]-misses[a.id]).map(p=>`<span class="tag"><b>${p.label}</b> ×${misses[p.id]}</span>`).join('')}</div><button class="link" id="reset">Clear the list</button>`;
    $('#reset').onclick=()=>{ misses={}; saveMisses(); renderHome(); }; }
  else tl.hidden=true;
}
function activePool(){
  const want=[];['prefix','suffix','root'].forEach(t=>{ if($('#set-'+t).checked) want.push(t.charAt(0).toUpperCase()+t.slice(1)) });
  const p=PARTS.filter(x=>want.includes(x.type));
  return p.length?p:PARTS.slice();
}

function start(mode){
  streak=0; updateChips();
  let order, n;
  if(mode==='challenge'){
    pool=PARTS.slice();                       // distractors come from the full set
    const tp=troubleParts(); if(!tp.length) return;
    const weighted=[]; tp.forEach(p=>{ for(let k=0;k<Math.min(misses[p.id],3);k++) weighted.push(p) });
    order=shuffle(weighted); n=Math.min(12,Math.max(6,order.length));
  } else if(mode==='match'){
    pool=activePool(); order=shuffle(pool);
    // sets of 3 with distinct meanings (-ion / -sion / -tion share one)
    const sets=[];
    order.forEach(p=>{ let s=sets.find(s=>s.length<3 && !s.some(q=>q.meaning===p.meaning)); if(!s){s=[];sets.push(s)} s.push(p); });
    let full=sets.filter(s=>s.length===3);
    if(!full.length){ full=[PARTS.filter(p=>['super','able','ver'].includes(p.id))]; }
    const chosen=full.slice(0,5);
    run={mode,i:0,n:chosen.length*3,right:0,missed:[],order,sets:chosen,s:0,title:'Match Up'};
    $('#home').hidden=true; $('#play').hidden=false; return next();
  } else {
    pool=activePool(); order=shuffle(pool);
    n = mode==='flash' ? pool.length : Math.min(10,pool.length*(mode==='detective'?3:1));
  }
  run={mode,i:0,n,right:0,missed:[],order,title:mode==='challenge'?'Challenge Round':null};
  $('#home').hidden=true; $('#play').hidden=false;
  next();
}
function goHome(){ run=null; $('#play').hidden=true; $('#home').hidden=false; renderHome(); window.scrollTo(0,0); }

function next(){
  if(run.i>=run.n) return finish();
  if(run.mode==='match') return renderMatch(run.sets[run.s]);
  const part = run.order[run.i % run.order.length];
  let mode=run.mode;
  if(mode==='challenge') mode=pick(['meaning','reverse','detective','detective','sorter']);
  if(mode==='flash') return renderFlash(part);
  if(mode==='sorter') return renderSorter(part);
  return renderMC(part,mode);
}
function onRight(part){ run.right++; bumpStreak(); popGood(); if(run.mode==='challenge') recordHit(part); }
function onWrong(part){ streak=0; updateChips(); run.missed.push(part); recordMiss(part); }
function progressHtml(){ return `<div class="bar"><i style="width:${(run.i/run.n)*100}%"></i></div>`; }
function headHtml(label,counter){ return `<div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow">${run.title||label} · ${counter||`${run.i+1} of ${run.n}`}</span><button class="btn ghost" style="flex:0;min-width:0;padding:6px 14px;font-size:.9rem" id="quit">Home</button></div>`; }

/* ---- Match Up: drag (or tap, tap) word parts onto meanings ---- */
function renderMatch(set){
  const parts=shuffle(set), defs=shuffle(set);
  $('#play').innerHTML = `<div class="card">${headHtml('Match Up',`set ${run.s+1} of ${run.sets.length}`)}${progressHtml()}
    <p class="hint">Drag each word part onto its meaning. Or tap a part, then tap a meaning.</p>
    <div class="match">
      <div class="tray" id="tray">${parts.map(p=>`<div class="piece" data-id="${p.id}" tabindex="0">${p.label}</div>`).join('')}</div>
      <div class="zones">${defs.map(p=>`<div class="zone" data-id="${p.id}"><div class="def">${p.meaning}</div><div class="slot"></div></div>`).join('')}</div>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="row"><button class="btn" id="check" disabled>Check</button></div></div>`;
  $('#quit').onclick=goHome;
  const tray=$('#tray'), zones=[...document.querySelectorAll('.zone')], chips=[...document.querySelectorAll('.piece')];
  let sel=null, firstCheck=true;
  const byId=id=>set.find(p=>p.id===id);
  function select(ch){ chips.forEach(c=>c.classList.remove('sel')); sel=ch; if(ch) ch.classList.add('sel'); }
  function updateCheck(){ $('#check').disabled = zones.some(z=>!z.querySelector('.slot .piece')); }
  function place(chip,zone){
    if(chip.classList.contains('locked')) return;
    const slot=zone.querySelector('.slot'); const prev=slot.querySelector('.piece');
    if(prev && prev!==chip){ if(prev.classList.contains('locked')) return; tray.appendChild(prev); }
    slot.appendChild(chip); zone.classList.remove('bad'); select(null); updateCheck();
  }
  function toTray(chip){ if(chip.classList.contains('locked')) return; tray.appendChild(chip); select(null); updateCheck(); }

  chips.forEach(ch=>{
    let sx,sy,moved=false,dragging=false;
    ch.addEventListener('pointerdown',e=>{
      if(ch.classList.contains('locked')) return;
      sx=e.clientX; sy=e.clientY; moved=false; dragging=true; ch.setPointerCapture(e.pointerId); ch.classList.add('drag');
    });
    ch.addEventListener('pointermove',e=>{
      if(!dragging) return; const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
      ch.style.transform=`translate(${dx}px,${dy}px)`;
      zones.forEach(z=>z.classList.remove('over'));
      const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone'); if(under) under.classList.add('over');
    });
    const end=e=>{
      if(!dragging) return; dragging=false; ch.classList.remove('drag'); ch.style.transform=''; zones.forEach(z=>z.classList.remove('over'));
      if(moved){ const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone'); if(under) place(ch,under); else if(ch.closest('.slot')) toTray(ch); }
      else { if(ch.closest('.slot')) toTray(ch); else select(sel===ch?null:ch); }
    };
    ch.addEventListener('pointerup',end); ch.addEventListener('pointercancel',end);
    ch.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(ch.closest('.slot')) toTray(ch); else select(sel===ch?null:ch);} });
  });
  zones.forEach(z=>{
    z.addEventListener('click',e=>{ if(e.target.closest('.piece')) return; if(sel) place(sel,z); });
  });

  $('#check').onclick=()=>{
    let allRight=true, delay=0;
    zones.forEach(z=>{
      const chip=z.querySelector('.slot .piece'); if(!chip||chip.classList.contains('locked')) return;
      const ok=chip.dataset.id===z.dataset.id; const part=byId(chip.dataset.id);
      if(ok){ chip.classList.add('locked'); z.classList.add('good'); if(firstCheck){ run.right++; } run.i++; bumpStreak(); setTimeout(popGood,delay); delay+=260; }
      else { allRight=false; z.classList.add('bad'); chip.classList.add('wrongchip'); if(firstCheck){ onWrong(part); } setTimeout(()=>{ chip.classList.remove('wrongchip'); tray.appendChild(chip); updateCheck(); },450); }
    });
    const fb=$('#fb');
    if(allRight){
      fb.className='feedback good'; fb.textContent=firstCheck?'All three. The beaver is proud.':'Got there. Nice work.';
      $('#check').textContent = run.s+1>=run.sets.length?'See results':'Next set'; $('#check').disabled=false;
      $('#check').onclick=()=>{ run.s++; next(); };
    } else {
      const bad=pick(BAD); fb.className='feedback bad'; fb.textContent=bad[1]+' Try the ones that bounced back.'; popBad(bad[0]);
      if(firstCheck){ /* unmatched pairs still count toward the round total */ }
    }
    firstCheck=false;
  };
}

function renderFlash(part){
  const ex=part.examples.map(e=>`<li><b>${e[0]}</b>: ${e[1]}</li>`).join('');
  $('#play').innerHTML = `<div class="card">${headHtml('Flashcards')}${progressHtml()}
    <div class="flip" id="flip" tabindex="0" role="button" aria-label="Flip card"><div class="inner">
      <div class="face"><span class="eyebrow" style="text-align:center">${part.type} · tap to flip</span><p class="prompt big" style="text-align:center">${part.label}</p></div>
      <div class="face back"><p class="prompt">${part.meaning}${part.pos?` <span class="hint">(${part.pos})</span>`:''}</p><ul>${ex}</ul></div>
    </div></div>
    <div class="row"><button class="btn berry" id="nope">Not yet</button><button class="btn leaf" id="yep">Got it!</button></div></div>`;
  const f=$('#flip'); const flip=()=>f.classList.toggle('is-flipped');
  f.addEventListener('click',flip); f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
  $('#quit').onclick=goHome;
  $('#yep').onclick=()=>{ onRight(part); run.i++; next(); };
  $('#nope').onclick=()=>{ onWrong(part); run.i++; next(); };
}

function renderSorter(part){
  const opts=shuffle(['Prefix','Suffix','Root']);
  $('#play').innerHTML = `<div class="card">${headHtml('Speedy Sorter')}${progressHtml()}
    <span class="eyebrow">What kind of word part is this?</span><p class="prompt big">${part.label}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="after"></div></div>`;
  $('#quit').onclick=goHome;
  wireOpts(part, o=>o===part.type, `<b>${part.label}</b> is a ${part.type.toLowerCase()}. It means <b>${part.meaning}</b>.`);
}

function renderMC(part,kind){
  let prompt,hint,label,correct,distract,render,explain;
  if(kind==='meaning'){
    label='Meaning Match'; prompt=part.label; hint='What does this word part mean?';
    correct=part; distract=pool.filter(p=>p.meaning!==part.meaning); render=p=>p.meaning;
    explain=`<b>${part.label}</b> means <b>${part.meaning}</b>. Example: <b>${part.examples[0][0]}</b>, ${part.examples[0][1]}.`;
  } else if(kind==='reverse'){
    const ex=pick(part.examples);
    label='Backwards Bear'; prompt=part.meaning; hint=`Which word part means this? (Think of the word <b>${ex[0]}</b>.)`;
    correct=part; distract=pool.filter(p=>p.meaning!==part.meaning); render=p=>p.label;
    explain=`<b>${part.label}</b> means <b>${part.meaning}</b>, as in <b>${ex[0]}</b>: ${ex[1]}.`;
  } else {
    const ex=pick(part.examples);
    label='Word Detective'; prompt=ex[0]; hint=`Which word part is hiding in this word? (It means: ${ex[1]}.)`;
    correct=part; distract=pool.filter(p=>p.id!==part.id && !p.forms.some(f=>ex[0].includes(f))); render=p=>p.label;
    explain=`<b>${ex[0]}</b> uses <b>${part.label}</b> (${part.meaning}). ${ex[0]} means ${ex[1]}.`;
  }
  if(distract.length<3) distract=PARTS.filter(p=>p.id!==part.id && p.meaning!==part.meaning);
  const opts=shuffle([correct,...shuffle(distract).slice(0,3)]);
  $('#play').innerHTML = `<div class="card">${headHtml(label)}${progressHtml()}
    <p class="prompt ${kind==='reverse'?'':'big'}">${prompt}</p><p class="hint">${hint}</p>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o.id}">${esc(render(o))}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="after"></div></div>`;
  $('#quit').onclick=goHome;
  wireOpts(part, v=>v===part.id, explain);
}

function wireOpts(part,isRight,explain){
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.addEventListener('click',()=>{
    btns.forEach(x=>{x.disabled=true; if(isRight(x.dataset.v)) x.classList.add('right')});
    const ok=isRight(b.dataset.v); const fb=$('#fb');
    if(ok){ onRight(part); fb.className='feedback good'; fb.textContent='Yes! '+pick(['Nailed it.','Exactly.','Too easy for you.','Correct and stylish.']); }
    else { const bad=pick(BAD); b.classList.add('wrong'); onWrong(part); popBad(bad[0]); fb.className='feedback bad'; fb.textContent=bad[1]; }
    $('#after').innerHTML=`<div class="explain">${explain}</div><div class="row" style="margin-top:10px"><button class="btn" id="nxt">${run.i+1>=run.n?'See results':'Next'}</button></div>`;
    $('#nxt').onclick=()=>{ run.i++; next(); }; $('#nxt').focus();
  }));
}

function finish(){
  const pct=Math.round(100*run.right/run.n);
  const line = pct===100?'Perfect. The whole forest is standing and clapping.':pct>=80?'Great round. The owl is nodding slowly.':pct>=60?'Solid. The squirrels want a rematch.':'Keep going. Even the sloth started somewhere.';
  const parade=shuffle(CRITTERS).slice(0,Math.max(3,Math.round(run.right/run.n*10))).join(' ');
  const missed=[...new Map(run.missed.map(p=>[p.id,p])).values()];
  const tp=troubleParts();
  const chalLine = run.mode==='challenge'
    ? (tp.length?`Still on the list: ${tp.length}. Keep going and the fox lets them go.`:'The trouble list is empty. The fox is speechless.')
    : (tp.length?`Trouble spots so far: ${tp.length}. The Challenge Round is waiting on the home screen.`:'');
  $('#play').innerHTML=`<div class="card end"><span class="eyebrow" style="text-align:center">Round over</span><p class="prompt">${line}</p><div class="parade">${parade}</div>
    <div class="stat"><div><b>${run.right}/${run.n}</b><span>Right</span></div><div><b>${pct}%</b><span>Score</span></div><div><b>${best}</b><span>Best streak</span></div></div>
    ${missed.length?`<div class="missed"><span class="eyebrow">Worth another look</span><br>${missed.map(p=>`<b>${p.label}</b>: ${p.meaning}`).join('<br>')}</div>`:''}
    ${chalLine?`<p class="hint" style="text-align:center">${chalLine}</p>`:''}
    <div class="row"><button class="btn ghost" id="home2">Home</button>${tp.length&&run.mode!=='challenge'?'<button class="btn leaf" id="chal">Challenge Round</button>':''}<button class="btn" id="again">Play again</button></div></div>`;
  $('#home2').onclick=goHome; $('#again').onclick=()=>start(run.mode);
  const cb=$('#chal'); if(cb) cb.onclick=()=>start('challenge');
  if(pct===100) burst();
}

renderHome(); updateChips();
</script>
</body>
</html>
